<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>义乌老板娘 · 穿越经营记 | 新时代中国经济腾飞</title>
<style>
/* ==================== 基础与变量 ==================== */
:root{
  --blue-900:#062247;
  --blue-800:#0a2f5c;
  --blue-700:#0d47a1;
  --blue-600:#1565c0;
  --blue-500:#1e88e5;
  --blue-300:#7cc0ff;
  --blue-100:#e3f0ff;
  --red-700:#a80d15;
  --red-600:#cf1a22;
  --red-500:#e53935;
  --red-300:#ff8a80;
  --gold-400:#ffca28;
  --gold-500:#f5a623;
  --gold-600:#d98a0b;
  --ink:#0f1b2d;
  --ink-2:#31435c;
  --ink-3:#6b7d95;
  --line:#e3eaf3;
  --paper:#f4f7fc;
  --white:#ffffff;
  --ok:#12a150;
  --bad:#e0552b;
  --r-lg:26px;
  --r-md:18px;
  --r-sm:12px;
  --sh-1:0 2px 6px rgba(10,47,92,.06), 0 8px 20px rgba(10,47,92,.08);
  --sh-2:0 10px 26px rgba(10,47,92,.14), 0 26px 60px rgba(10,47,92,.16);
  --sh-btn:0 6px 16px rgba(21,101,192,.30);
  --ease:cubic-bezier(.22,.9,.28,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 700px at 12% -10%, rgba(30,136,229,.28), transparent 60%),
    radial-gradient(900px 620px at 100% 0%, rgba(229,57,53,.20), transparent 55%),
    radial-gradient(900px 800px at 50% 120%, rgba(13,71,161,.30), transparent 60%),
    linear-gradient(165deg,#051a37 0%,#0a2f5c 42%,#062247 100%);
  min-height:100vh;
  overflow-x:hidden;
  touch-action:manipulation;
}
/* 背景光斑 */
body::before{
  content:"";position:fixed;inset:-20% -10%;
  background:
    radial-gradient(closest-side, rgba(124,192,255,.16), transparent) 18% 22%/44vw 44vw no-repeat,
    radial-gradient(closest-side, rgba(255,138,128,.13), transparent) 86% 74%/40vw 40vw no-repeat;
  filter:blur(6px);pointer-events:none;z-index:0;
  animation:auroraFloat 18s ease-in-out infinite alternate;
}
@keyframes auroraFloat{
  0%{transform:translate3d(0,0,0) scale(1);}
  100%{transform:translate3d(0,-3%,0) scale(1.06);}
}
/* 星点 */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.stars i{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:rgba(255,255,255,.75);
  box-shadow:0 0 8px rgba(150,200,255,.9);
  animation:twinkle linear infinite;
}
@keyframes twinkle{
  0%{transform:translateY(0) scale(.6);opacity:0;}
  20%{opacity:.9;}
  80%{opacity:.7;}
  100%{transform:translateY(-70px) scale(1.1);opacity:0;}
}

/* ==================== 手机外框 ==================== */
.phone{
  position:relative;z-index:2;
  width:min(460px,100vw);
  min-height:100vh;min-height:100dvh;
  margin:0 auto;
  padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
}
.screen{display:none;}
.screen.on{display:flex;flex-direction:column;gap:14px;animation:screenIn .5s var(--ease) both;}
@keyframes screenIn{
  from{opacity:0;transform:translateY(16px) scale(.985);}
  to{opacity:1;transform:none;}
}

/* ==================== 顶部 HUD ==================== */
.hud{
  position:sticky;top:8px;z-index:30;
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.7);
  border-radius:var(--r-md);
  box-shadow:var(--sh-1);
  backdrop-filter:blur(14px) saturate(140%);
}
.hud-back{
  flex:0 0 auto;width:34px;height:34px;border-radius:11px;border:1px solid var(--line);
  background:linear-gradient(180deg,#fff,#eff5fd);color:var(--blue-700);
  font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:transform .18s var(--ease), box-shadow .18s var(--ease);
  box-shadow:0 2px 6px rgba(10,47,92,.08);
}
.hud-back:active{transform:scale(.92);}
.hud-mid{flex:1 1 auto;min-width:0;}
.hud-route{
  font-size:11px;letter-spacing:.14em;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-transform:uppercase;font-weight:700;
}
.hud-dots{display:flex;gap:5px;margin-top:6px;}
.hud-dots span{
  flex:1 1 auto;height:5px;border-radius:99px;background:#dfe8f4;
  transition:background .45s var(--ease), box-shadow .45s var(--ease);
}
.hud-dots span.done{background:linear-gradient(90deg,var(--blue-500),var(--red-500));box-shadow:0 0 8px rgba(30,136,229,.55);}
.hud-dots span.now{background:linear-gradient(90deg,var(--blue-300),var(--blue-500));animation:pulseDot 1.6s ease-in-out infinite;}
@keyframes pulseDot{50%{opacity:.55;}}

.xp-chip{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:7px 11px 7px 9px;border-radius:99px;
  background:linear-gradient(135deg,#0d47a1,#1565c0 55%,#1e88e5);
  color:#fff;box-shadow:var(--sh-btn);
}
.xp-chip svg{width:16px;height:16px;flex:0 0 auto;}
.xp-num{
  font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;
  min-width:2ch;text-align:right;
}
.xp-num.bump{animation:bump .55s var(--ease);}
@keyframes bump{
  0%{transform:scale(1);}
  35%{transform:scale(1.32);color:var(--gold-400);text-shadow:0 0 12px rgba(255,202,40,.9);}
  100%{transform:scale(1);}
}
.xp-float{
  position:fixed;z-index:400;pointer-events:none;
  font-weight:900;font-size:22px;color:var(--gold-400);
  text-shadow:0 4px 14px rgba(0,0,0,.45);
  animation:floatUp 1.15s var(--ease) forwards;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.7);}
  25%{opacity:1;transform:translate(-50%,-14px) scale(1.15);}
  100%{opacity:0;transform:translate(-50%,-70px) scale(1);}
}

/* ==================== 通用卡片 ==================== */
.card{
  position:relative;
  background:var(--white);
  border:1px solid rgba(255,255,255,.9);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-2);
  overflow:hidden;
}
.card-pad{padding:18px;}

/* ==================== 封面 ==================== */
.hero{
  padding:0;overflow:hidden;
  background:linear-gradient(160deg,#0a2f5c,#123f77 45%,#0d47a1);
}
.hero-art{position:relative;height:216px;overflow:hidden;}
.hero-art::after{
  content:"";position:absolute;inset:auto 0 0 0;height:64%;
  background:linear-gradient(180deg,transparent,rgba(6,34,71,.92));
}
.hero-badge{
  position:absolute;top:14px;left:14px;z-index:4;
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.16em;
  background:linear-gradient(135deg,var(--red-600),var(--red-500));
  color:#fff;box-shadow:0 8px 20px rgba(207,26,34,.5);
}
.hero-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulseDot 1.3s infinite;}
.hero-title{
  position:absolute;left:16px;right:16px;bottom:12px;z-index:4;color:#fff;
}
.hero-title h1{
  margin:0;font-size:27px;line-height:1.2;letter-spacing:.01em;
  text-shadow:0 4px 20px rgba(0,0,0,.5);
}
.hero-title h1 em{
  font-style:normal;
  background:linear-gradient(120deg,#ffd76e,#ffca28 40%,#ff9d5c);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-title p{
  margin:7px 0 0;font-size:12.5px;color:rgba(226,240,255,.9);letter-spacing:.06em;
}
.hero-body{padding:18px;color:var(--ink);}
.logline{
  font-size:14px;line-height:1.85;color:var(--ink-2);margin:0 0 14px;
}
.logline b{color:var(--blue-700);}
.logline .hl{color:var(--red-600);font-weight:800;}
.tagrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.tag{
  font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;
  background:var(--blue-100);color:var(--blue-700);border:1px solid #cfe3fb;
}
.tag.red{background:#ffeaea;color:var(--red-700);border-color:#ffd2d2;}

/* 按钮 */
.btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:16px 18px;border:none;border-radius:var(--r-md);
  font-size:16px;font-weight:800;font-family:inherit;letter-spacing:.04em;
  cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#0d47a1,#1565c0 48%,#1e88e5);
  box-shadow:var(--sh-btn);
  transition:transform .2s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
  overflow:hidden;
}
.btn::after{
  content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-18deg);animation:sheen 3.4s ease-in-out infinite;
}
@keyframes sheen{0%,72%{left:-60%;}100%{left:130%;}}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(21,101,192,.4);filter:saturate(1.08);}
.btn:active{transform:translateY(1px) scale(.985);box-shadow:0 4px 12px rgba(21,101,192,.34);}
.btn.red{
  background:linear-gradient(135deg,var(--red-700),var(--red-600) 50%,#f0554a);
  box-shadow:0 6px 16px rgba(207,26,34,.34);
}
.btn.red:hover{box-shadow:0 12px 26px rgba(207,26,34,.44);}
.btn.ghost{
  background:linear-gradient(180deg,#fff,#f1f6fd);color:var(--blue-700);
  border:1.5px solid #cfe0f5;box-shadow:0 3px 10px rgba(10,47,92,.08);
}
.btn.ghost::after{display:none;}
.btn.sm{padding:13px 16px;font-size:14.5px;border-radius:14px;}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}

/* ==================== 选线页 ==================== */
.sec-title{
  color:#fff;text-align:center;margin:6px 0 2px;
}
.sec-title h2{margin:0;font-size:21px;letter-spacing:.05em;}
.sec-title p{margin:8px 0 0;font-size:12.5px;color:rgba(222,236,255,.78);letter-spacing:.05em;}

.route{
  cursor:pointer;transition:transform .28s var(--ease), box-shadow .28s var(--ease);
  border:none;text-align:left;width:100%;font-family:inherit;padding:0;
  background:#fff;
}
.route:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(3,20,44,.42);}
.route:active{transform:translateY(-1px) scale(.995);}
.route-art{position:relative;height:126px;overflow:hidden;}
.route-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,34,71,.05),rgba(6,34,71,.55));}
.route-no{
  position:absolute;top:12px;left:12px;z-index:3;
  width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  font-weight:900;font-size:15px;color:#fff;
  background:rgba(8,32,64,.55);border:1px solid rgba(255,255,255,.4);
  backdrop-filter:blur(6px);
}
.route-time{
  position:absolute;bottom:10px;left:14px;z-index:3;color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.14em;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}
.route-body{padding:15px 16px 17px;}
.route-body h3{margin:0 0 6px;font-size:18px;letter-spacing:.02em;color:var(--ink);}
.route-body .sub{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--red-600);margin-bottom:9px;}
.route-body p{margin:0 0 12px;font-size:13px;line-height:1.75;color:var(--ink-2);}
.route-meta{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:99px;
  background:#f0f5fc;color:var(--blue-700);border:1px solid #dbe8f8;
}
.route-go{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:linear-gradient(135deg,#0d47a1,#1e88e5);color:#fff;
  font-weight:800;font-size:14px;letter-spacing:.06em;
}
.route-go span:last-child{font-size:18px;transition:transform .25s var(--ease);}
.route:hover .route-go span:last-child{transform:translateX(5px);}

/* ==================== 剧情页 ==================== */
.node-head{
  display:flex;align-items:center;gap:10px;padding:13px 16px;
  background:linear-gradient(135deg,#0a2f5c,#0d47a1 60%,#1565c0);
  color:#fff;
}
.node-face{
  flex:0 0 auto;width:46px;height:46px;border-radius:15px;overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.35);
}
.node-face svg{display:block;width:100%;height:100%;}
.node-head .who{font-size:10.5px;letter-spacing:.2em;color:rgba(190,220,255,.9);font-weight:800;}
.node-head .nm{font-size:16px;font-weight:800;margin-top:3px;letter-spacing:.03em;}
.node-head .clock{
  margin-left:auto;text-align:right;font-size:10.5px;color:rgba(200,225,255,.85);
  font-weight:700;letter-spacing:.1em;line-height:1.6;
}
.node-head .clock b{display:block;font-size:14px;color:#fff;letter-spacing:.06em;}
/* 节点插图带 */
.node-art{
  position:relative;height:168px;overflow:hidden;
  border-bottom:1px solid #e6eefb;
}
.node-art svg{display:block;width:100%;height:100%;}
.node-art::after{
  content:"";position:absolute;inset:auto 0 0 0;height:42%;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.92));
}
.node-art::before{
  content:"";position:absolute;z-index:2;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--blue-600),var(--red-600));
}

.node-body{padding:17px 17px 6px;}
.story{font-size:14.5px;line-height:1.92;color:var(--ink-2);}
.story p{margin:0 0 12px;}
.story p:last-child{margin-bottom:0;}
.story .hl{color:var(--blue-700);font-weight:800;}
.story .warn{color:var(--red-600);font-weight:800;}
.story .sys{
  display:block;padding:11px 13px;border-radius:14px;margin:0 0 13px;
  background:linear-gradient(135deg,#eef6ff,#e6f0ff);border:1px dashed #b9d6f7;
  color:var(--blue-700);font-size:13px;line-height:1.8;font-weight:600;
}
.dialogue{
  position:relative;margin:0 0 13px;padding:12px 14px;border-radius:16px;
  background:linear-gradient(135deg,#f7faff,#eef4fd);border:1px solid #e0ebf9;
  font-size:13.5px;line-height:1.85;color:var(--ink-2);
}
.dialogue::before{
  content:"“";position:absolute;top:-6px;left:9px;font-size:40px;color:#cfe1f7;
  font-family:Georgia,serif;line-height:1;
}
.dialogue b{color:var(--red-600);}
.dialogue .say{display:block;font-size:11px;font-weight:800;color:var(--blue-600);letter-spacing:.1em;margin-bottom:5px;}

.ask{
  display:flex;align-items:center;gap:8px;margin:2px 0 12px;padding-left:2px;
  font-size:12.5px;font-weight:800;letter-spacing:.12em;color:var(--blue-700);
}
.ask::after{content:"";flex:1 1 auto;height:2px;border-radius:2px;background:linear-gradient(90deg,#cfe1f7,transparent);}

/* 选项 */
.choices{display:flex;flex-direction:column;gap:11px;padding:0 17px 18px;}
.choice{
  position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:14px 15px;border-radius:var(--r-md);cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,#ffffff,#f8fbff);
  border:1.5px solid #e2ebf7;
  box-shadow:0 3px 10px rgba(10,47,92,.07);
  transition:transform .2s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease), background .22s var(--ease);
  overflow:hidden;
}
.choice::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--blue-500),var(--red-500));
  transform:scaleY(0);transform-origin:top;transition:transform .3s var(--ease);
}
.choice:hover{
  transform:translateY(-3px);border-color:#a9cdf3;
  box-shadow:0 12px 26px rgba(13,71,161,.18);
  background:linear-gradient(180deg,#fff,#f2f8ff);
}
.choice:hover::before{transform:scaleY(1);}
.choice:active{transform:translateY(-1px) scale(.99);}
.choice-key{
  flex:0 0 auto;width:28px;height:28px;border-radius:10px;display:grid;place-items:center;
  font-size:13px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,#1565c0,#1e88e5);
  box-shadow:0 4px 10px rgba(21,101,192,.32);
  transition:transform .2s var(--ease);
}
.choice:hover .choice-key{transform:rotate(-6deg) scale(1.08);}
.choice-txt{flex:1 1 auto;font-size:14px;line-height:1.7;color:var(--ink);font-weight:700;}
.choice-sub{display:block;margin-top:5px;font-size:11.5px;font-weight:500;color:var(--ink-3);line-height:1.6;}
.choice:disabled{opacity:.5;cursor:default;}
.choice.picked{border-color:var(--blue-500);background:linear-gradient(180deg,#eff7ff,#e5f1ff);}

/* 选项关键帧内若为触屏，去掉 hover 位移 */
@media (hover:none){
  .choice:hover{transform:none;}
  .route:hover{transform:none;}
  .btn:hover{transform:none;}
}

/* ==================== 过渡幕 ==================== */
.interlude{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:40px 24px;text-align:center;min-height:280px;
  background:linear-gradient(165deg,#0a2f5c,#0d47a1 60%,#123f77);
  border-radius:var(--r-lg);color:#fff;box-shadow:var(--sh-2);position:relative;overflow:hidden;
}
.interlude::before{
  content:"";position:absolute;width:340px;height:340px;border-radius:50%;
  border:1px solid rgba(160,205,255,.22);top:-120px;right:-120px;
  animation:spin 26s linear infinite;
}
.interlude::after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  border:1px dashed rgba(255,138,128,.28);bottom:-90px;left:-80px;
  animation:spin 18s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg);}}
.interlude .yr{
  font-size:44px;font-weight:900;letter-spacing:.06em;
  background:linear-gradient(120deg,#ffd76e,#ffca28 45%,#ff9d5c);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:screenIn .7s var(--ease) both;position:relative;z-index:2;
}
.interlude h3{margin:0;font-size:18px;letter-spacing:.08em;position:relative;z-index:2;animation:screenIn .7s .12s var(--ease) both;}
.interlude p{margin:0;font-size:13.5px;line-height:1.9;color:rgba(220,236,255,.9);max-width:330px;position:relative;z-index:2;animation:screenIn .7s .22s var(--ease) both;}
.interlude .tap{
  margin-top:6px;font-size:12px;letter-spacing:.24em;color:rgba(190,220,255,.75);
  animation:blink 1.5s ease-in-out infinite;position:relative;z-index:2;
}
@keyframes blink{50%{opacity:.3;}}

/* ==================== 模态框 ==================== */
.mask{
  position:fixed;inset:0;z-index:300;
  display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(4,18,38,.6);
  backdrop-filter:blur(10px) saturate(130%);
  -webkit-backdrop-filter:blur(10px) saturate(130%);
}
.mask.on{display:flex;animation:fadeIn .26s ease both;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  width:min(430px,100%);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  background:#fff;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.5);
  animation:modalIn .48s var(--ease) both;
}
@keyframes modalIn{
  0%{opacity:0;transform:translateY(38px) scale(.9);}
  60%{opacity:1;}
  100%{opacity:1;transform:none;}
}
.modal.out{animation:modalOut .22s ease forwards;}
@keyframes modalOut{to{opacity:0;transform:translateY(18px) scale(.96);}}

.m-top{
  position:relative;padding:18px 20px 16px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,#0a2f5c,#0d47a1 55%,#1a6fd4);
}
.m-top::after{
  content:"";position:absolute;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent);
  top:-110px;right:-60px;
}
.m-top .lv{
  display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;letter-spacing:.2em;
  padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.32);position:relative;z-index:2;
}
.m-top .res{
  margin:12px 0 0;font-size:18px;font-weight:900;letter-spacing:.03em;position:relative;z-index:2;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.m-top .delta{
  font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;
  padding:2px 12px;border-radius:12px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
  animation:popIn .5s .18s var(--ease) both;
}
.m-top .delta.plus{color:#ffe06b;text-shadow:0 0 16px rgba(255,202,40,.7);}
.m-top .delta.zero{color:#ffd0cb;}
@keyframes popIn{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
.m-top .delta-bar{
  margin-top:12px;height:7px;border-radius:99px;background:rgba(255,255,255,.2);
  overflow:hidden;position:relative;z-index:2;
}
.m-top .delta-bar i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ffd76e,#ffca28,#ff9d5c);
  box-shadow:0 0 12px rgba(255,202,40,.8);
  transition:width .85s var(--ease);
}
.m-body{padding:17px 19px 19px;}
.m-body .fb{
  font-size:13.5px;line-height:1.9;color:var(--ink-2);margin:0 0 4px;
}
.m-body .fb b{color:var(--blue-700);}
.m-body .fb .bad{color:var(--red-600);font-weight:800;}
.m-body .fb .ok{color:var(--ok);font-weight:800;}

.kcard{
  margin-top:14px;border-radius:18px;overflow:hidden;
  border:1.5px solid #ffe0a6;
  background:linear-gradient(180deg,#fffaf0,#fff5e0);
  box-shadow:0 8px 22px rgba(217,138,11,.14);
  animation:screenIn .55s .1s var(--ease) both;
}
.kcard .kh{
  display:flex;align-items:center;gap:8px;padding:11px 14px;
  background:linear-gradient(135deg,#d98a0b,#f5a623 55%,#ffca28);
  color:#fff;font-size:12.5px;font-weight:900;letter-spacing:.14em;
}
.kcard .kh .ico{
  width:22px;height:22px;border-radius:8px;display:grid;place-items:center;
  background:rgba(255,255,255,.24);font-size:12px;
}
.kcard .kb{padding:13px 14px 15px;}
.kcard .kb .kt{
  font-size:14px;font-weight:900;color:#8a5600;margin:0 0 8px;line-height:1.5;
}
.kcard .kb .kc{font-size:13px;line-height:1.92;color:#5c4a22;}
.kcard .kb .kc p{margin:0 0 9px;}
.kcard .kb .kc p:last-child{margin:0;}
.kcard .kb .kc b{color:#8a5600;}
.mark-hi{
  background:linear-gradient(180deg,transparent 62%,rgba(255,202,40,.55) 62%);
  font-weight:800;color:#7a4c00;padding:0 1px;
}
.stats{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
.stat{
  flex:1 1 46%;min-width:118px;padding:9px 11px;border-radius:13px;
  background:#fff;border:1px solid #ffe6bb;
}
.stat .sv{font-size:16px;font-weight:900;color:#c07400;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.stat .sl{font-size:10.5px;color:#8a7a55;margin-top:3px;line-height:1.5;font-weight:700;}

.m-foot{
  display:flex;gap:10px;align-items:center;
  padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid #eef3fa;background:#fbfdff;
  position:sticky;bottom:0;
}
.m-foot .tip{font-size:11px;color:var(--ink-3);line-height:1.6;flex:1 1 auto;font-weight:600;}
.m-foot .btn{width:auto;flex:0 0 auto;padding:14px 20px;font-size:14.5px;border-radius:15px;}
@media (max-width:380px){ .m-foot{flex-direction:column;align-items:stretch;} .m-foot .btn{width:100%;} }

/* ==================== 结局 ==================== */
.end-card{overflow:hidden;padding:0;}
.end-art{position:relative;height:238px;overflow:hidden;}
.end-art::after{content:"";position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.9));}
.end-body{padding:4px 20px 22px;text-align:center;position:relative;}
.end-badge{
  display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;
  font-size:11.5px;font-weight:900;letter-spacing:.22em;margin-bottom:12px;
}
.end-badge.win{background:linear-gradient(135deg,#d98a0b,#f5a623,#ffca28);color:#fff;box-shadow:0 8px 20px rgba(217,138,11,.4);}
.end-badge.lose{background:linear-gradient(135deg,#33475f,#5a6f89);color:#fff;box-shadow:0 8px 20px rgba(51,71,95,.35);}
.end-quote{
  font-size:19px;line-height:1.85;font-weight:800;letter-spacing:.02em;margin:0 0 8px;
  color:var(--ink);
}
.end-quote.win{
  background:linear-gradient(120deg,#a80d15,#cf1a22 40%,#d98a0b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.end-sub{font-size:12.5px;line-height:1.85;color:var(--ink-3);margin:0 0 16px;}
.score-panel{
  display:flex;gap:10px;margin:0 0 16px;
}
.score-box{
  flex:1 1 0;padding:13px 8px;border-radius:16px;background:linear-gradient(180deg,#f6faff,#eef5ff);
  border:1px solid #dfeafa;
}
.score-box .v{font-size:23px;font-weight:900;color:var(--blue-700);font-variant-numeric:tabular-nums;}
.score-box .l{font-size:10.5px;color:var(--ink-3);margin-top:4px;letter-spacing:.1em;font-weight:800;}
.score-box.acc .v{color:var(--red-600);}
.recap{text-align:left;margin:0 0 16px;border-radius:16px;background:#f8fbff;border:1px solid #e6effb;overflow:hidden;}
.recap summary{
  cursor:pointer;padding:12px 14px;font-size:12.5px;font-weight:800;color:var(--blue-700);
  letter-spacing:.08em;list-style:none;display:flex;align-items:center;gap:8px;
}
.recap summary::-webkit-details-marker{display:none;}
.recap summary::before{
  content:"＋";display:grid;place-items:center;width:20px;height:20px;border-radius:7px;
  background:var(--blue-100);color:var(--blue-700);font-size:12px;
}
.recap[open] summary::before{content:"－";}
.recap ul{margin:0;padding:0 14px 14px;list-style:none;}
.recap li{
  display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.75;
  color:var(--ink-2);padding:7px 0;border-top:1px dashed #e2ecf8;
}
.recap li .rk{flex:0 0 auto;font-weight:900;color:var(--blue-600);}
.recap li .rv{margin-left:auto;flex:0 0 auto;font-weight:900;font-variant-numeric:tabular-nums;}
.recap li .rv.p{color:var(--ok);}
.recap li .rv.z{color:var(--bad);}

/* ==================== 表彰大会 CG ==================== */
.cg{position:absolute;inset:0;}
.cg-sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#7b0d13 0%,#c2171f 26%,#e8574a 52%,#f7b26b 74%,#ffd9a0 100%);
}
.cg-rays{
  position:absolute;left:50%;top:-30%;width:150%;height:150%;
  transform:translateX(-50%);
  background:conic-gradient(from 0deg at 50% 50%,
    rgba(255,236,180,.34) 0deg 5deg, transparent 5deg 22deg,
    rgba(255,236,180,.26) 22deg 27deg, transparent 27deg 44deg,
    rgba(255,236,180,.34) 44deg 49deg, transparent 49deg 66deg,
    rgba(255,236,180,.26) 66deg 71deg, transparent 71deg 90deg);
  animation:spin 40s linear infinite;opacity:.85;mix-blend-mode:screen;
}
.cg-fireworks{position:absolute;inset:0;}
.fw{
  position:absolute;width:5px;height:5px;border-radius:50%;
  box-shadow:
    0 0 6px 2px rgba(255,225,150,.95),
    22px 0 0 -1px rgba(255,120,110,.9), -22px 0 0 -1px rgba(255,120,110,.9),
    0 22px 0 -1px rgba(255,225,150,.9), 0 -22px 0 -1px rgba(255,225,150,.9),
    16px 16px 0 -1px rgba(255,180,120,.85), -16px -16px 0 -1px rgba(255,180,120,.85),
    16px -16px 0 -1px rgba(160,215,255,.85), -16px 16px 0 -1px rgba(160,215,255,.85);
  animation:fwPop 2.6s ease-out infinite;
}
@keyframes fwPop{
  0%{transform:scale(.15);opacity:0;}
  18%{opacity:1;}
  100%{transform:scale(1.9);opacity:0;}
}
.cg-stage{
  position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(180deg,#3d0a10,#6b1119 40%,#8d1a20);
  border-top:3px solid rgba(255,215,150,.55);
}
.cg-stage::after{
  content:"";position:absolute;left:8%;right:8%;top:14px;height:66%;
  border-radius:14px 14px 0 0;
  background:
    linear-gradient(180deg,rgba(255,214,140,.22),transparent 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 12px,transparent 12px 24px);
  border:1px solid rgba(255,214,140,.28);
}
.cg-podium{
  position:absolute;left:50%;bottom:34%;transform:translateX(-50%);
  width:112px;height:74px;border-radius:10px 10px 4px 4px;
  background:linear-gradient(180deg,#ffd98a,#d99a2e 70%,#a86f12);
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}
.cg-podium::after{
  content:"义乌";position:absolute;left:0;right:0;top:26px;text-align:center;
  font-size:19px;font-weight:900;color:#7b3f04;letter-spacing:.16em;
}
.cg-person{
  position:absolute;left:50%;bottom:calc(34% + 62px);transform:translateX(-50%);
  width:74px;height:112px;animation:breathe 3.4s ease-in-out infinite;
}
@keyframes breathe{50%{transform:translateX(-50%) translateY(-3px);}}
.cg-hands{
  position:absolute;left:50%;bottom:34%;transform:translate(-50%,-6px);
  display:flex;gap:52px;
}
.cg-spot{
  position:absolute;top:-6%;width:44%;height:118%;
  background:conic-gradient(from 180deg at 50% 0%,transparent 0deg,rgba(255,238,190,.42) 20deg,transparent 40deg);
  filter:blur(3px);animation:spotSway 5.5s ease-in-out infinite alternate;
}
.cg-spot.l{left:-6%;transform-origin:50% 0;}
.cg-spot.r{right:-6%;transform-origin:50% 0;animation-delay:-2.4s;}
@keyframes spotSway{from{transform:rotate(-9deg);}to{transform:rotate(9deg);}}
.cg-dust{position:absolute;inset:0;}
.cg-dust i{
  position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;
  background:rgba(255,225,160,.9);box-shadow:0 0 8px rgba(255,210,120,.9);
  animation:rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(0) scale(.5);opacity:0;}
  15%{opacity:.95;}
  100%{transform:translateY(-260px) scale(1.1);opacity:0;}
}

/* 败局 CG */
.cg.dusk .cg-sky{background:linear-gradient(180deg,#0b1b31 0%,#1d3f66 34%,#3d5f80 58%,#8a7686 78%,#d69a76 100%);}
.cg.dusk .cg-rays{display:none;}
.cg-street{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,#0d1c2e,#050d18);}
.cg-shop{
  position:absolute;left:50%;bottom:30%;transform:translateX(-50%);
  width:132px;height:104px;border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,#20344c,#14243a);
  border:1px solid rgba(140,180,225,.28);
}
.cg-shop::before{
  content:"";position:absolute;left:14px;right:14px;top:16px;height:42px;border-radius:4px;
  background:repeating-linear-gradient(90deg,#0b1626 0 7px,#233850 7px 14px);
}
.cg-shop::after{
  content:"卷帘门";position:absolute;left:14px;right:14px;bottom:10px;text-align:center;
  font-size:10px;letter-spacing:.24em;color:rgba(150,185,225,.55);
}
.cg-lamp{
  position:absolute;bottom:34%;width:16px;height:16px;border-radius:50%;
  background:#ffd98a;box-shadow:0 0 26px 12px rgba(255,200,120,.55);
  animation:lampGlow 3.6s ease-in-out infinite;
}
@keyframes lampGlow{50%{opacity:.6;}}
.cg-lamp.a{left:16%;} .cg-lamp.b{right:16%;animation-delay:-1.4s;}
.cg-lamp::after{
  content:"";position:absolute;left:50%;bottom:14px;width:3px;height:52px;
  background:linear-gradient(180deg,rgba(140,175,215,.8),transparent);transform:translateX(-50%);
}
.cg-tworow{
  position:absolute;left:0;right:0;bottom:30%;height:20px;
  background:repeating-linear-gradient(90deg,#ffcf7a 0 8px,transparent 8px 34px);
  opacity:.7;filter:blur(.4px);
}

.foot-note{
  text-align:center;font-size:10.5px;color:rgba(180,206,238,.6);
  letter-spacing:.12em;padding:2px 0 6px;
}

/* ==================== 表彰大会 · 华丽升华 ==================== */
.end-card.ceremony{overflow:visible;}
.end-card.ceremony .end-art.win-art{height:270px;overflow:hidden;border-radius:var(--r-lg) var(--r-lg) 0 0;}

/* 空中礼花（定时刷新） */
.fw2{
  position:absolute;width:6px;height:6px;border-radius:50%;
  box-shadow:
    0 0 8px 3px rgba(255,238,190,.95),
    30px 0 0 -1px rgba(255,140,130,.9), -30px 0 0 -1px rgba(255,140,130,.9),
    0 30px 0 -1px rgba(255,238,190,.9), 0 -30px 0 -1px rgba(255,238,190,.9),
    21px 21px 0 -1px rgba(255,190,130,.85), -21px -21px 0 -1px rgba(255,190,130,.85),
    21px -21px 0 -1px rgba(150,215,255,.9), -21px 21px 0 -1px rgba(150,215,255,.9),
    44px 0 0 -2px rgba(255,220,150,.7), -44px 0 0 -2px rgba(255,220,150,.7),
    0 44px 0 -2px rgba(255,220,150,.7), 0 -44px 0 -2px rgba(255,220,150,.7);
  animation:fwBurst 1.5s ease-out both;
}
@keyframes fwBurst{
  0%{transform:scale(.1);opacity:1;}
  55%{opacity:1;}
  100%{transform:scale(2.1);opacity:0;}
}

/* 彩带雨 */
.cg-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:6;}
.cg-confetti i{
  position:absolute;top:-14%;border-radius:2px;display:block;
  animation-name:confettiFall;animation-timing-function:linear;animation-iteration-count:infinite;
  opacity:.95;
}
@keyframes confettiFall{
  0%{transform:translate3d(0,-10%,0) rotate(0deg);opacity:0;}
  8%{opacity:1;}
  100%{transform:translate3d(var(--sway,20px),900%,0) rotate(760deg);opacity:.9;}
}

/* 绶带 */
.win-ribbon{
  position:absolute;z-index:7;left:-6px;top:20px;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));
}
.win-ribbon span{
  display:inline-block;padding:9px 20px 9px 16px;
  background:linear-gradient(135deg,#ffe9a8,#ffca28 45%,#e0a11a);
  color:#7a2a06;font-weight:900;font-size:14px;letter-spacing:.32em;
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
.win-ribbon::after{
  content:"";position:absolute;left:0;top:100%;width:6px;height:14px;
  background:#b8781a;clip-path:polygon(0 0,100% 0,0 100%);
}

/* 正文 */
.ceremony-body{padding:2px 18px 24px;text-align:center;}
.ceremony-body .end-badge{margin-top:16px;}

/* 颁奖词金匾 */
.award-plate{
  position:relative;margin:2px 0 16px;padding:20px 18px 16px;border-radius:20px;
  background:
    radial-gradient(120% 100% at 50% 0%, rgba(255,222,140,.22), transparent 60%),
    linear-gradient(160deg,#7b1115,#a8111a 45%,#6b0d12);
  border:1.5px solid rgba(255,214,140,.55);
  box-shadow:0 14px 34px rgba(120,14,20,.36), inset 0 1px 0 rgba(255,235,180,.35);
  animation:plateIn .7s .1s var(--ease) both;
  overflow:hidden;
}
@keyframes plateIn{from{opacity:0;transform:translateY(16px) scale(.96);}to{opacity:1;transform:none;}}
.award-plate::before,.award-plate::after{
  content:"";position:absolute;width:56px;height:56px;border:2px solid rgba(255,214,140,.32);
  border-radius:50%;
}
.award-plate::before{left:-24px;bottom:-24px;}
.award-plate::after{right:-24px;top:-24px;}
.ap-cap{
  display:inline-block;margin-bottom:12px;padding:4px 14px;border-radius:99px;
  background:rgba(255,214,140,.16);border:1px solid rgba(255,214,140,.5);
  font-size:10.5px;font-weight:900;letter-spacing:.4em;color:#ffe9a8;
}
.award-say{
  margin:0;font-size:18.5px;line-height:1.9;font-weight:800;letter-spacing:.02em;
  background:linear-gradient(100deg,#ffe9a8,#fff6d6 30%,#ffca28 55%,#ffe9a8 80%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:goldFlow 5.5s linear infinite;
  position:relative;z-index:2;
}
@keyframes goldFlow{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
.ap-meta{margin-top:11px;font-size:11.5px;line-height:1.75;color:rgba(255,224,190,.72);letter-spacing:.02em;}

/* 过渡分隔 */
.dawn{display:flex;align-items:center;gap:11px;margin:22px 2px 14px;}
.dawn-line{flex:1 1 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(13,71,161,.35),transparent);}
.dawn-tag{
  flex:0 0 auto;font-size:11.5px;font-weight:900;letter-spacing:.24em;
  background:linear-gradient(120deg,#0d47a1,#a80d15);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:plateIn .7s .2s var(--ease) both;
}

.label-row{
  display:flex;align-items:center;gap:8px;justify-content:center;
  font-size:12px;font-weight:900;letter-spacing:.26em;color:var(--red-700);
  margin:0 0 12px;animation:plateIn .7s .26s var(--ease) both;
}
.label-dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#cf1a22,#f0554a);box-shadow:0 0 10px rgba(207,26,34,.6);animation:pulseDot 1.6s infinite;}

/* 成就网格 */
.ach-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 10px;
}
.ach{
  position:relative;padding:13px 10px 12px;border-radius:16px;overflow:hidden;
  background:linear-gradient(170deg,#fffdf6,#fff6e2);
  border:1px solid #ffe3b0;
  box-shadow:0 8px 20px rgba(217,138,11,.13), inset 0 1px 0 #fff;
  animation:plateIn .6s var(--ease) both;
}
.ach:nth-child(1){animation-delay:.30s;}
.ach:nth-child(2){animation-delay:.36s;}
.ach:nth-child(3){animation-delay:.42s;}
.ach:nth-child(4){animation-delay:.48s;}
.ach::after{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,#cf1a22,#ffca28);
}
.ach-rank{
  font-size:20px;font-weight:900;letter-spacing:.02em;line-height:1.2;
  background:linear-gradient(120deg,#a80d15,#d98a0b 60%,#f5a623);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ach-name{margin-top:5px;font-size:11.5px;font-weight:800;color:#8a6a33;letter-spacing:.06em;}
.ach-note{
  margin:0 0 20px;font-size:12.5px;color:var(--ink-3);letter-spacing:.02em;
  animation:plateIn .6s .52s var(--ease) both;
}
.ach-note b{color:var(--red-700);}

/* 根本保证 */
.sys-block{margin:0 0 20px;text-align:left;animation:plateIn .7s .3s var(--ease) both;}
.sys-cap{
  display:flex;align-items:center;gap:9px;margin:0 0 10px;
  font-size:12px;font-weight:900;letter-spacing:.28em;color:#fff;
}
.sys-cap::before{
  content:"";width:4px;height:16px;border-radius:2px;
  background:linear-gradient(180deg,#ffca28,#cf1a22);
}
.sys-lead{
  margin:0 0 13px;padding:14px 15px;border-radius:16px;
  background:linear-gradient(160deg,#f4f9ff,#e9f2ff);border:1px solid #d5e6fa;
  font-size:13.5px;line-height:1.95;color:var(--ink-2);
}
.sys-lead b{color:var(--red-700);font-weight:900;}
.sys-card{
  position:relative;display:flex;gap:14px;align-items:center;
  padding:16px;border-radius:18px;overflow:hidden;
  background:linear-gradient(150deg,#7b1115,#a80d15 42%,#123f77);
  border:1.5px solid rgba(255,214,140,.42);
  box-shadow:0 16px 34px rgba(120,14,20,.32), inset 0 1px 0 rgba(255,235,180,.28);
}
.sys-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(90% 70% at 88% 8%, rgba(255,214,140,.26), transparent 62%);
  pointer-events:none;
}
.sys-emblem{
  flex:0 0 auto;width:56px;height:56px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.10);border:1.5px solid rgba(255,214,140,.6);
  box-shadow:0 0 22px rgba(255,202,40,.3);
}
.sys-emblem svg{display:block;width:42px;height:42px;}
.sys-txt{flex:1 1 auto;position:relative;z-index:2;min-width:0;}
.sys-title{margin:0 0 8px;font-size:11px;font-weight:900;letter-spacing:.26em;color:#ffe9a8;}
.sys-line{margin:0;font-size:13px;line-height:1.7;color:#fff;font-weight:700;}
.sys-line .em{
  color:#ffd76e;font-weight:900;
  background:linear-gradient(180deg,transparent 62%,rgba(255,202,40,.3) 62%);
  padding:0 2px;
}
.sys-div{height:1px;margin:9px 0;background:linear-gradient(90deg,rgba(255,214,140,.55),transparent);}

/* 结语 */
.coda{
  position:relative;margin:0;padding:20px 17px 18px;border-radius:20px;text-align:center;
  background:linear-gradient(165deg,#051a37,#0a2f5c 45%,#8b1119);
  border:1.5px solid rgba(255,214,140,.4);
  box-shadow:0 16px 36px rgba(6,30,64,.4), inset 0 1px 0 rgba(255,235,180,.22);
  overflow:hidden;
  animation:plateIn .7s .36s var(--ease) both;
}
.coda::before{
  content:"";position:absolute;left:50%;top:-60%;width:150%;height:180%;
  transform:translateX(-50%);
  background:conic-gradient(from 0deg at 50% 50%,
    rgba(255,222,150,.16) 0deg 6deg, transparent 6deg 26deg,
    rgba(255,222,150,.12) 26deg 32deg, transparent 32deg 52deg,
    rgba(255,222,150,.16) 52deg 58deg, transparent 58deg 78deg);
  animation:spin 46s linear infinite;pointer-events:none;
}
.coda-stars{
  position:relative;z-index:2;font-size:13px;letter-spacing:.7em;text-indent:.7em;
  color:#ffd76e;text-shadow:0 0 12px rgba(255,202,40,.8);margin-bottom:10px;
}
.coda-lead{
  position:relative;z-index:2;margin:0 0 13px;font-size:12px;font-weight:900;
  letter-spacing:.34em;color:rgba(255,233,168,.9);
}
.coda-rows{position:relative;z-index:2;display:flex;flex-direction:column;gap:8px;margin-bottom:15px;}
.coda-row{
  padding:10px 12px;border-radius:13px;text-align:left;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,214,140,.25);
}
.coda-row .ck{
  display:inline-block;margin-right:9px;padding:2px 8px;border-radius:99px;
  background:linear-gradient(135deg,#cf1a22,#e53935);color:#fff;
  font-size:10.5px;font-weight:900;letter-spacing:.1em;vertical-align:1px;
}
.coda-row .cv{font-size:12.5px;line-height:1.7;color:#eaf3ff;font-weight:700;}
.coda-end{
  position:relative;z-index:2;margin:0;font-size:14px;line-height:1.95;color:#fff;font-weight:700;
}
.coda-end b{
  font-size:16px;font-weight:900;
  background:linear-gradient(100deg,#ffe9a8,#fff6d6 35%,#ffca28 60%,#ffe9a8 85%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:goldFlow 5.5s linear infinite;
}

.end-acts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.end-acts .btn{width:100%;}

@media (prefers-reduced-motion: reduce){
  .cg-confetti,.fw2,.coda::before,.award-say,.coda-end b{animation:none !important;}
  .cg-confetti{display:none;}
}


/* ==================== 党统领 · 政策托底 ==================== */
.pol-band{
  position:relative;margin:0 0 15px;padding:13px 14px 12px;border-radius:16px;
  background:linear-gradient(160deg,#f5f9ff,#ecf3fe);
  border:1px solid #d3e4f9;border-left:4px solid var(--red-600);
  box-shadow:0 6px 16px rgba(13,71,161,.08);
}
.pol-tag{
  display:inline-block;margin-bottom:9px;padding:4px 10px;border-radius:99px;
  background:linear-gradient(135deg,var(--blue-700),#1e88e5);color:#fff;
  font-size:10px;font-weight:900;letter-spacing:.16em;
}
.pol-row{display:flex;gap:9px;align-items:flex-start;padding:4px 0;}
.pol-row + .pol-row{border-top:1px dashed #dceafb;}
.pol-k{
  flex:0 0 62px;padding-top:2px;font-size:10px;font-weight:900;letter-spacing:.08em;
  color:var(--blue-700);text-align:right;
}
.pol-v{flex:1 1 auto;font-size:12px;line-height:1.7;color:var(--ink-2);}
.pol-v.hl{color:var(--red-700);font-weight:800;}

/* ==================== 序幕 · 时间刻度 ==================== */
.imarks{
  width:100%;max-width:340px;margin:16px 0 4px;padding:13px 14px;border-radius:16px;
  background:rgba(255,255,255,.08);border:1px solid rgba(160,205,255,.3);
  text-align:left;position:relative;z-index:2;
  animation:screenIn .7s .3s var(--ease) both;
}
.imarks-cap{
  font-size:10.5px;font-weight:900;letter-spacing:.2em;color:#ffe9a8;margin-bottom:10px;
}
.imark{display:flex;gap:10px;align-items:flex-start;padding:5px 0;}
.imark + .imark{border-top:1px dashed rgba(160,205,255,.22);}
.im-yr{
  flex:0 0 54px;font-size:11px;font-weight:900;color:#7cc0ff;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;padding-top:1px;
}
.im-tx{flex:1 1 auto;font-size:11.5px;line-height:1.65;color:rgba(226,240,255,.9);}
.imarks-quote{
  margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,214,140,.35);
  font-size:12px;line-height:1.7;font-weight:800;color:#ffd76e;letter-spacing:.02em;
}

/* ==================== 结局 · 政策时间轴 ==================== */
.ptl{
  text-align:left;border-radius:18px;overflow:hidden;margin:0 0 20px;
  background:#fff;border:1px solid #e2ecf9;box-shadow:0 10px 26px rgba(13,71,161,.09);
  animation:plateIn .7s .32s var(--ease) both;
}
.ptl-row{
  display:flex;gap:11px;align-items:flex-start;padding:11px 13px;
}
.ptl-row + .ptl-row{border-top:1px dashed #e6eefa;}
.ptl-yr{
  flex:0 0 46px;font-size:12px;font-weight:900;color:#fff;text-align:center;
  padding:3px 0;border-radius:8px;
  background:linear-gradient(135deg,var(--red-700),var(--red-500));
  font-variant-numeric:tabular-nums;
}
.ptl-tx{flex:1 1 auto;font-size:11.5px;line-height:1.7;color:var(--ink-3);}
.ptl-tx b{display:block;font-size:12.5px;color:var(--blue-700);font-weight:900;margin-bottom:2px;}

/* ==================== PC 横屏 ==================== */
@media (min-width:900px){
  body{padding:0;}
  .phone{
    width:min(1120px,94vw);
    min-height:100vh;
    padding:22px 22px 30px;

    grid-template-rows:auto 1fr;
    gap:16px 22px;
    align-content:start;
  }
  .phone>.hud{grid-column:1 / -1;}
  .phone>#side{grid-column:1;grid-row:2;position:sticky;top:86px;align-self:start;}

  .phone>.screen.on.full{grid-column:1 / -1;max-width:760px;margin:0 auto;width:100%;}
  .side-card{
    background:rgba(255,255,255,.96);border-radius:var(--r-lg);box-shadow:var(--sh-2);
    padding:20px;border:1px solid rgba(255,255,255,.8);
  }
  .side-card h3{
    margin:0 0 4px;font-size:16px;color:var(--ink);letter-spacing:.04em;
  }
  .side-card .sm{font-size:11.5px;color:var(--ink-3);letter-spacing:.1em;font-weight:800;margin-bottom:14px;}
  .side-stat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .side-stat .row{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 13px;border-radius:14px;background:linear-gradient(180deg,#f6faff,#eef5ff);
    border:1px solid #e0eafa;
  }
  .side-stat .row .k{font-size:11.5px;color:var(--ink-3);font-weight:800;letter-spacing:.08em;}
  .side-stat .row .v{font-size:18px;font-weight:900;color:var(--blue-700);font-variant-numeric:tabular-nums;}
  .side-stat .row.goal .v{color:var(--red-600);}
  .side-timeline{display:flex;flex-direction:column;gap:0;}
  .tl{display:flex;gap:11px;position:relative;padding-bottom:16px;}
  .tl:last-child{padding-bottom:0;}
  .tl::before{
    content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#e3ecf8;
  }
  .tl:last-child::before{display:none;}
  .tl.done::before{background:linear-gradient(180deg,var(--blue-500),#cfe1f7);}
  .tl .dot{
    flex:0 0 auto;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;
    background:#eaf1fa;color:#9fb3cc;font-size:10px;font-weight:900;z-index:2;
    border:2px solid #fff;box-shadow:0 0 0 1.5px #dde8f6;
    transition:all .3s var(--ease);
  }
  .tl.done .dot{background:linear-gradient(135deg,#0d47a1,#1e88e5);color:#fff;box-shadow:0 0 0 1.5px #cfe1f7;}
  .tl.now .dot{background:linear-gradient(135deg,var(--red-600),#f0554a);color:#fff;box-shadow:0 0 0 3px rgba(224,80,60,.22);}
  .tl .tt{font-size:12.5px;font-weight:800;color:var(--ink-2);line-height:1.5;padding-top:2px;}
  .tl.now .tt{color:var(--red-600);}
  .tl .td{font-size:10.5px;color:var(--ink-3);margin-top:3px;line-height:1.6;}
  .side-quote{
    margin-top:14px;padding:13px 14px;border-radius:15px;
    background:linear-gradient(135deg,#0a2f5c,#0d47a1);color:#fff;
    font-size:12.5px;line-height:1.85;letter-spacing:.02em;
  }
  .side-quote b{color:var(--gold-400);}
  .hero-art{height:240px;}
  .cg-person{width:88px;height:132px;}
}
@media (min-width:900px) and (max-height:760px){

  .tl{padding-bottom:11px;}
}

const MAX_SCORE = 120;   // 达标线 = 权重 30 × 4

const el = id => document.getElementById(id);

const screens = {

function show(name){
  Object.keys(screens).forEach(k=>{
    screens[k].classList.toggle("on", k===name);
    screens[k].classList.toggle("full", k==="title"||k==="pick"||k==="inter"||k==="end");

/* =====================================================================

   ===================================================================== */
function hudDots(){
  const box = el("hudDots");
  const nodes = state.route ? state.route.nodes : [];
  box.innerHTML = nodes.map((n,i)=>{
    const cls = i<state.idx ? "done" : (i===state.idx ? "now" : "");
    return `<span class="${cls}"></span>`;
  }).join("");
}
function setXP(v, animate){
  const n = el("xpNum");
  if(animate){
    n.classList.remove("bump");
    void n.offsetWidth;
    n.classList.add("bump");
  }
  n.textContent = v;
}
function hudShow(on){
  el("hud").style.display = on ? "" : "none";
}
function sideShow(on){
  if(!on){ el("side").style.display="none"; return; }
  el("side").style.display = "";
  renderSide();
}
function renderSide(){
  const side = el("side");
  // 离开剧情页后（侧栏已收起）延迟触发的时间回调不再重绘
  if(!state.route || side.style.display === "none"){ side.innerHTML=""; return; }
  const nodes = state.route.nodes;
  const tl = nodes.map((n,i)=>{
    const cls = i<state.idx ? "done" : (i===state.idx ? "now" : "");
    return `<div class="tl ${cls}">
      <div class="dot">${i<state.idx?"✓":(i+1)}</div>
      <div><div class="tt">${n.yr} · ${n.place.split("·").pop().trim()}</div>
      <div class="td">${i<state.idx?(state.picks[i]?("已选："+state.picks[i].k):"已完成"):(i===state.idx?"当前节点":"待解锁")}</div></div>
    </div>`;
  }).join("");
  side.innerHTML = `<div class="side-card">
    <h3>${state.route.name}</h3>
    <div class="sm">${state.route.sub}</div>
    <div class="side-stat">
      <div class="row"><span class="k">商业经验</span><span class="v">${state.xp}</span></div>
      <div class="row goal"><span class="k">达标线</span><span class="v">≥ ${MAX_SCORE}</span></div>
      <div class="row"><span class="k">完成进度</span><span class="v">${state.idx}/${nodes.length}</span></div>
    </div>
    <div class="side-timeline">${tl}</div>
    <div class="side-quote">“我们的每一次选择，<b>汇聚为中国世界工厂经济腾飞的奇迹。</b>”</div>
  </div>`;
}

function startRoute(route){
  state.route = route;
  state.idx = 0;
  state.xp = 0;
  state.picks = [];
  state.locked = false;
  hudShow(true);
  el("hudRoute").textContent = `${route.no} · ${route.name}`;
  setXP(0,false);
  hudDots();
  sideShow(true);

  showInter({
    yr:route.time.split(" ")[0],
    title:route.name,

}

  if(confirm("返回故事线选择？本轮进度将丢失。")){

/* =====================================================================

function renderNode(){
  const nodes = state.route.nodes;
  if(state.idx >= nodes.length){ finish(); return; }
  const n = nodes[state.idx];
  state.locked = false;

  const storyHTML = n.story.map(s=>{
    if(s.t==="sys") return `<span class="sys">${s.v}</span>`;
    if(s.t==="d")   return `<div class="dialogue"><span class="say">${s.say}</span>${s.v}</div>`;
    return `<p>${s.v}</p>`;
  }).join("");

  const optsHTML = n.options.map((o,i)=>`
    <button class="choice" data-i="${i}" data-mood="${o.mood}">
      <span class="choice-key">${o.k}</span>
      <span class="choice-txt">${o.t}${o.s?`<span class="choice-sub">${o.s}</span>`:""}</span>
    </button>
  `).join("");

  el("nodeCard").innerHTML = `
    <div class="node-head">
      <div class="node-face">${SV[n.face==="guest"?"faceGuest":"faceMe"]()}</div>
      <div>
        <div class="who">${n.who}</div>
        <div class="nm">${n.nm}</div>
      </div>
      <div class="clock">NODE ${state.idx+1}/${nodes.length}<b>${n.yr}</b></div>
    </div>
    ${n.art && SV[n.art] ? `<div class="node-art">${SV[n.art]("n"+state.route.id+state.idx)}</div>` : ""}
    ${n.pol ? `<div class="pol-band">
      <div class="pol-tag">🇨🇳 党统领 · 政策托底</div>
      <div class="pol-row"><span class="pol-k">中央部署</span><span class="pol-v">${n.pol.d}</span></div>
      <div class="pol-row"><span class="pol-k">义乌举措</span><span class="pol-v">${n.pol.m}</span></div>
      ${n.pol.y && n.pol.y !== "——" ? `<div class="pol-row"><span class="pol-k">对你的支撑</span><span class="pol-v hl">${n.pol.y}</span></div>` : ""}
    </div>` : ""}
    <div class="node-body">
      <div class="story">${storyHTML}</div>
      <div class="ask">${n.ask}</div>
    </div>
    <div class="choices">${optsHTML}</div>
  `;
  hudDots();
  renderSide();
  show("story");
}

/* 选项点击 */
el("nodeCard").addEventListener("click", e=>{
  const btn = e.target.closest(".choice");
  if(!btn || state.locked) return;
  state.locked = true;
  const i = +btn.dataset.i;
  const n = state.route.nodes[state.idx];
  const opt = n.options[i];
  state.picks[state.idx] = opt;

  // 视觉：选中态 + 其他禁用
  el("nodeCard").querySelectorAll(".choice").forEach((b,bi)=>{
    b.disabled = true;
    if(bi===i) b.classList.add("picked");
  });

  // 经验变化
  const before = state.xp;
  const xp = opt.w * XP_UNIT;
  state.xp += xp;
  flyXP(btn, xp, before, state.xp);

  setTimeout(()=>openModal(opt), 330);
});

function flyXP(anchor, delta, before, after){
  const r = anchor.getBoundingClientRect();
  const chip = document.querySelector(".xp-chip").getBoundingClientRect();
  const d = document.createElement("div");
  d.className = "xp-float";
  d.textContent = (delta>0?"+":"") + delta;
  d.style.left = (chip.left + chip.width/2) + "px";
  d.style.top  = (chip.top - 6) + "px";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 1200);
  setTimeout(()=>{
    setXP(after, true);
    renderSide();
  }, 320);
  void r; void before;
}

const MOOD = {
  best:{ lv:"最优抉择", res:"经验大幅提升", tip:"知识卡片：真实背景" },
  mid: { lv:"可行抉择", res:"经验有所增长", tip:"对比知识卡片里的真实选择" },
  bad: { lv:"风险抉择", res:"经验增长有限", tip:"知识卡片里藏着正确解法" }
};
const MOOD_COLOR = {
  best:["linear-gradient(135deg,#0a2f5c,#0d47a1 55%,#1a6fd4)", "#ffd76e"],
  mid: ["linear-gradient(135deg,#123f77,#1565c0 60%,#3d8fd8)", "#bfe0ff"],
  bad: ["linear-gradient(135deg,#4a1b1f,#8a2b2b 60%,#b8433a)", "#ffd0cb"]
};

function openModal(opt){
  const m = MOOD[opt.mood];
  const col = MOOD_COLOR[opt.mood];
  el("modal").className = "modal";
  el("modal").style.display = "";
  const top = document.querySelector(".m-top");
  top.style.background = col[0];

  el("mLevel").textContent = m.lv;
  el("mResText").textContent = m.res;
  const xp = opt.w * XP_UNIT;
  const d = el("mDelta");
  d.textContent = "+" + xp + " 经验";
  d.className = "delta plus";
  el("mTip").textContent = m.tip;

  // 经验进度条（相对本节点满分的比例）
  const ratio = Math.min(1, xp/(5*XP_UNIT));
  const bar = el("mBar");
  bar.style.width = "0%";
  setTimeout(()=>{ bar.style.width = (ratio*100).toFixed(0)+"%"; }, 120);

  let html = `<p class="fb">${opt.fb}</p>`;
  if(opt.kn){
    html += `<div class="kcard">
      <div class="kh"><span class="ico">★</span>知识卡片</div>
      <div class="kb">
        <p class="kt">${opt.kn.t}</p>
        <div class="kc">${opt.kn.c.map(p=>`<p>${p}</p>`).join("")}</div>
        ${opt.kn.stats?`<div class="stats">${opt.kn.stats.map(s=>`<div class="stat"><div class="sv">${s[0]}</div><div class="sl">${s[1]}</div></div>`).join("")}</div>`:""}
      </div>
    </div>`;
  }
  el("mBody").innerHTML = html;
  el("mBody").scrollTop = 0;

  el("mask").classList.add("on");
  document.body.style.overflow = "hidden";
}

function closeModal(cb){
  const modal = el("modal");
  modal.classList.add("out");
  setTimeout(()=>{
    el("mask").classList.remove("on");
    modal.classList.remove("out");
    document.body.style.overflow = "";
    if(cb) cb();
  }, 200);
}

el("mNext").addEventListener("click", ()=>{
  closeModal(()=>{
    state.idx++;
    const nodes = state.route.nodes;
    if(state.idx >= nodes.length){ finish(); return; }

/* ---------------- 未达标：黯然关门 + 再玩一次 ---------------- */
function finishLose(){
  const nodes = state.route.nodes;
  const bests = state.picks.filter(p=>p && p.mood==="best").length;
  const recap = nodes.map((n,i)=>{
    const p = state.picks[i];
    if(!p) return "";
    return `<li><span class="rk">${n.yr}</span><span>${p.k} · ${p.s||"抉择"}</span><span class="rv ${p.mood==="best"?"p":"z"}">+${p.w*XP_UNIT}</span></li>`;
  }).join("");

  el("endCard").innerHTML = `
    <div class="end-art">${cgLose()}</div>
    <div class="end-body">
      <div class="end-badge lose">经营复盘 · 未达标</div>
      <p class="end-quote">时代的浪潮下，你的店铺黯然关门，但义乌的灯火依旧通明。要不再试一次？</p>
      <p class="end-sub">距离达标线还差 ${MAX_SCORE-state.xp} 点经验。真实世界的义乌老板娘们，也曾在很多个这样的夜晚重新开始。</p>
      <div class="score-panel">
        <div class="score-box"><div class="v">${state.xp}</div><div class="l">商业经验</div></div>
        <div class="score-box"><div class="v">${MAX_SCORE}</div><div class="l">达标线</div></div>
        <div class="score-box acc"><div class="v">${bests}/${nodes.length}</div><div class="l">最优抉择</div></div>
      </div>
      <details class="recap">
        <summary>本轮回顾（${state.route.name}）</summary>
        <ul>${recap}</ul>
      </details>
      <div class="end-acts">
        <button class="btn" id="btnEndAgain">再玩一次</button>
        <button class="btn ghost sm" id="btnEndPick">返回故事线选择</button>
      </div>
      <div class="foot-note" style="margin-top:14px;color:#94a7bf">
        取材于 12 组真实案例 · 人物真实，情节为虚构演绎
      </div>
    </div>
  `;
  show("end");
  bindEndButtons(false);
}

function bindEndButtons(win){
  el("btnEndAgain").addEventListener("click", ()=>{
    stopCeremony();
    if(win){
      state.route = null;
      show("pick"); hudShow(false); sideShow(false);
    }else{
      const id = state.route.id;
      startRoute(ROUTES.find(r=>r.id===id));
    }
  });
  el("btnEndPick").addEventListener("click", ()=>{
    stopCeremony();
    state.route=null; show("pick"); hudShow(false); sideShow(false);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------------- 氛围：彩带雨 + 空中礼花 ---------------- */
let ceremonyTimers = [];
function startCeremony(){
  stopCeremony();
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const box = el("confetti");
  if(box){
    const colors = ["#ffd76e","#ffca28","#e53935","#cf1a22","#7cc0ff","#ffffff","#f5a623"];
    let html = "";
    for(let i=0;i<42;i++){
      const c = colors[(Math.random()*colors.length)|0];
      html += `<i style="left:${(Math.random()*100).toFixed(1)}%;width:${(Math.random()*5+4).toFixed(1)}px;height:${(Math.random()*9+7).toFixed(1)}px;background:${c};animation-duration:${(Math.random()*3.4+3.6).toFixed(2)}s;animation-delay:-${(Math.random()*4).toFixed(2)}s;--sway:${((Math.random()*2-1)*40).toFixed(0)}px"></i>`;
    }
    box.innerHTML = html;
  }

  const fw = el("cgFire");
  if(fw){
    const burst = ()=>{
      let html = "";
      for(let i=0;i<3;i++){
        html += `<div class="fw2" style="left:${(Math.random()*76+12).toFixed(1)}%;top:${(Math.random()*40+4).toFixed(1)}%;animation-delay:${(Math.random()*0.5).toFixed(2)}s"></div>`;
      }
      fw.innerHTML = html;
    };
    burst();
    ceremonyTimers.push(setInterval(burst, 2400));
  }
}
function stopCeremony(){
  ceremonyTimers.forEach(t=>clearInterval(t));
  ceremonyTimers = [];
}

/* =====================================================================
   十、键盘操作（桌面：1/2/3 选择，Enter 继续）
   ===================================================================== */
document.addEventListener("keydown", e=>{
  if(el("mask").classList.contains("on")){
    if(e.key==="Enter" || e.key===" "){ e.preventDefault(); el("mNext").click(); }
    return;
  }
  if(screens.story.classList.contains("on") && !state.locked){
    const idx = ["1","2","3","4"].indexOf(e.key);
    if(idx>=0){
      const btns = el("nodeCard").querySelectorAll(".choice");
      if(btns[idx]) btns[idx].click();
    }
  }else if(screens.inter.classList.contains("on")){
    if(e.key==="Enter" || e.key===" "){ e.preventDefault(); el("btnInterNext").click(); }
  }else if(screens.title.classList.contains("on")){
    if(e.key==="Enter" || e.key===" "){ e.preventDefault(); el("btnStart").click(); }
  }
});

/* 初始 */
show("title");
